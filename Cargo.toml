[package]
name        = "exfer-walletd"
version     = "1.12.1"
edition     = "2021"
description = "Exfer Wallet Daemon — independent wallet service that exposes generate_address / transfer / balance over JSON-RPC, talking to one or more Exfer nodes"
license     = "MIT"
repository  = "https://github.com/exfer-stack/exfer-walletd"
homepage    = "https://github.com/exfer-stack/exfer-walletd"

[[bin]]
name = "exfer-walletd"
path = "src/main.rs"

[dependencies]
# Reuse Exfer's wallet + transaction crypto so signing is byte-for-byte
# identical to the upstream CLI. Pinned to a fork commit (not a branch)
# for reproducible builds.
#
# The fork's main is upstream main + the canonical HTLC observability
# types (HtlcRecord / HtlcState / HtlcRole / HtlcClaimRecord /
# HtlcReclaimRecord) that this daemon's follower + index + JSON-RPC
# surface consume. The types are awaiting re-land in ahuman-exfer/exfer
# (PR #23). Once that PR merges, this can switch to a tag pin on the
# upstream release that contains them.
exfer = { git = "https://github.com/exfer-stack/exfer.git", rev = "99c45cfde397ca6602685ee9993a30317ae4e2f3" }

axum            = { version = "0.7", features = ["macros"] }

# Embedded KV for the v1.9 HTLC observability index. Matches the
# upstream node's storage choice — single-file, MVCC reads, no daemon.
redb            = "2"
bincode         = "1.3"
base64          = "0.22"
tokio           = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "fs"] }
tokio-util      = { version = "0.7", features = ["rt"] }
futures         = "0.3"
tower            = "0.5"
tower-http       = { version = "0.6", features = ["trace", "cors"] }
reqwest          = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde            = { version = "1", features = ["derive"] }
serde_json       = "1"
hex              = "0.4"
tracing          = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow           = "1"
thiserror        = "1"
clap             = { version = "4", features = ["derive", "env"] }
subtle           = "2"
rand             = "0.8"
ed25519-dalek    = "2"

# HD keystore: BIP39 mnemonic + SLIP-0010 ed25519 derivation;
# argon2id-derived KEK + ChaCha20-Poly1305 sealing of the seed on disk.
bip39            = { version = "2", features = ["rand"] }
slip10_ed25519   = "0.1"
argon2           = "0.5"
chacha20poly1305 = "0.10"
zeroize          = { version = "1", features = ["derive"] }

# TLS termination (--tls). axum-server reuses our axum/tokio stack and
# accepts a rustls ServerConfig directly; rcgen issues the self-signed
# leaf; sha2 hashes the DER for the fingerprint we pin in the SDK.
axum-server      = { version = "0.7", features = ["tls-rustls"] }
rcgen            = "0.13"
rustls           = "0.23"
rustls-pemfile   = "2"
sha2             = "0.10"
time             = "0.3"

# BSC / EVM cross-chain swap leg. secp256k1 BIP-32 derivation (m/44'/60'/0'/0/0)
# from the same HD seed as the EXFER ed25519 keys, plus alloy for EIP-1559 tx
# signing + ABI encoding. We deliberately avoid alloy's provider/transport stack
# and talk to BSC over the existing reqwest client to keep the mobile
# cross-compile lean.
bip32            = "0.5"
alloy = { version = "1.0", default-features = false, features = [
    "consensus",
    "eips",
    "signers",
    "signer-local",
    "sol-types",
] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[profile.release]
opt-level     = "z"
lto           = true
codegen-units = 1
strip         = true
