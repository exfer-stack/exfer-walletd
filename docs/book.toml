[book]
title = "exfer-walletd"
description = "Exfer Wallet Daemon — independent JSON-RPC wallet service"
authors = ["exfer-stack"]
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/exfer-stack/exfer-walletd"
edit-url-template = "https://github.com/exfer-stack/exfer-walletd/edit/main/docs/{path}"
no-section-label = true
copy-fonts = true
additional-css = []

[output.html.fold]
enable = true
level = 1

[output.html.playground]
runnable = false

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 2
boost-paragraph = 1
expand = true
heading-split-level = 3
